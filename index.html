<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Mi Agenda</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f5fb;
      color: #222;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }
    .form-row input,
    .form-row textarea,
    .form-row button {
      font: inherit;
    }
    .form-row input,
    .form-row textarea {
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
      flex: 1 1 150px;
    }
    .form-row textarea {
      min-height: 60px;
      resize: vertical;
      flex-basis: 100%;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 4px;
      padding: 8px 14px;
    }
    .btn-primary {
      background: #3b82f6;
      color: white;
    }
    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
    }
    .btn-danger {
      background: #ef4444;
      color: white;
    }
    .filters {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 15px 0;
      gap: 10px;
      flex-wrap: wrap;
    }
    .events-list {
      list-style: none;
      margin-top: 10px;
    }
    .event-item {
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .event-main {
      flex: 1;
    }
    .event-title {
      font-weight: 600;
      margin-bottom: 4px;
    }
    .event-meta {
      font-size: 0.9rem;
      color: #6b7280;
      margin-bottom: 4px;
    }
    .event-desc {
      font-size: 0.9rem;
    }
    .event-actions {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    @media (max-width: 600px) {
      .event-item {
        flex-direction: column;
        align-items: stretch;
      }
      .event-actions {
        flex-direction: row;
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>
  <h1>Mi Agenda</h1>
  <div class="container">
    <h2>Nuevo evento</h2>
    <form id="eventForm">
      <div class="form-row">
        <input type="text" id="titulo" placeholder="Título" required />
        <input type="date" id="fecha" required />
        <input type="time" id="hora" required />
      </div>
      <div class="form-row">
        <textarea id="descripcion" placeholder="Descripción (opcional)"></textarea>
      </div>
      <div class="form-row">
        <button type="submit" class="btn-primary">Guardar evento</button>
        <button type="button" id="limpiarBtn" class="btn-secondary">Limpiar</button>
      </div>
      <input type="hidden" id="editId" />
    </form>

    <div class="filters">
      <div>
        <strong>Filtrar por fecha:</strong>
        <input type="date" id="filtroFecha" />
        <button id="limpiarFiltro" class="btn-secondary">Quitar filtro</button>
      </div>
      <div>
        <strong>Total eventos: </strong><span id="totalEventos">0</span>
      </div>
    </div>

    <h2>Eventos</h2>
    <ul id="listaEventos" class="events-list"></ul>
  </div>

  <script>
    const STORAGE_KEY = "mis_eventos_agenda";

    function leerEventos() {
      const data = localStorage.getItem(STORAGE_KEY);
      if (!data) return [];
      try {
        return JSON.parse(data);
      } catch {
        return [];
      }
    }

    function guardarEventos(eventos) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(eventos));
    }

    function ordenarEventos(eventos) {
      return eventos.sort((a, b) => {
        const da = a.fecha + " " + a.hora;
        const db = b.fecha + " " + b.hora;
        return da.localeCompare(db);
      });
    }

    function renderEventos() {
      const lista = document.getElementById("listaEventos");
      const total = document.getElementById("totalEventos");
      const filtroFecha = document.getElementById("filtroFecha").value;

      let eventos = leerEventos();
      if (filtroFecha) {
        eventos = eventos.filter(e => e.fecha === filtroFecha);
      }
      eventos = ordenarEventos(eventos);

      lista.innerHTML = "";
      total.textContent = eventos.length;

      if (eventos.length === 0) {
        const li = document.createElement("li");
        li.textContent = "No hay eventos.";
        lista.appendChild(li);
        return;
      }

      eventos.forEach(ev => {
        const li = document.createElement("li");
        li.className = "event-item";

        const main = document.createElement("div");
        main.className = "event-main";

        const title = document.createElement("div");
        title.className = "event-title";
        title.textContent = ev.titulo;

        const meta = document.createElement("div");
        meta.className = "event-meta";
        meta.textContent = `${ev.fecha} · ${ev.hora}`;

        const desc = document.createElement("div");
        desc.className = "event-desc";
        desc.textContent = ev.descripcion || "";

        main.appendChild(title);
        main.appendChild(meta);
        if (ev.descripcion) main.appendChild(desc);

        const actions = document.createElement("div");
        actions.className = "event-actions";

        const btnEdit = document.createElement("button");
        btnEdit.textContent = "Editar";
        btnEdit.className = "btn-secondary";
        btnEdit.onclick = () => cargarEnFormulario(ev.id);

        const btnDel = document.createElement("button");
        btnDel.textContent = "Eliminar";
        btnDel.className = "btn-danger";
        btnDel.onclick = () => eliminarEvento(ev.id);

        actions.appendChild(btnEdit);
        actions.appendChild(btnDel);

        li.appendChild(main);
        li.appendChild(actions);
        lista.appendChild(li);
      });
    }

    function limpiarFormulario() {
      document.getElementById("titulo").value = "";
      document.getElementById("fecha").value = "";
      document.getElementById("hora").value = "";
      document.getElementById("descripcion").value = "";
      document.getElementById("editId").value = "";
    }

    function cargarEnFormulario(id) {
      const eventos = leerEventos();
      const ev = eventos.find(e => e.id === id);
      if (!ev) return;
      document.getElementById("titulo").value = ev.titulo;
      document.getElementById("fecha").value = ev.fecha;
      document.getElementById("hora").value = ev.hora;
      document.getElementById("descripcion").value = ev.descripcion || "";
      document.getElementById("editId").value = ev.id;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function eliminarEvento(id) {
      if (!confirm("¿Seguro que quieres eliminar este evento?")) return;
      let eventos = leerEventos();
      eventos = eventos.filter(e => e.id !== id);
      guardarEventos(eventos);
      renderEventos();
    }

    document.getElementById("eventForm").addEventListener("submit", e => {
      e.preventDefault();
      const titulo = document.getElementById("titulo").value.trim();
      const fecha = document.getElementById("fecha").value;
      const hora = document.getElementById("hora").value;
      const descripcion = document.getElementById("descripcion").value.trim();
      const editId = document.getElementById("editId").value;

      if (!titulo || !fecha || !hora) {
        alert("Título, fecha y hora son obligatorios.");
        return;
      }

      let eventos = leerEventos();

      if (editId) {
        eventos = eventos.map(e =>
          e.id === editId
            ? { ...e, titulo, fecha, hora, descripcion }
            : e
        );
      } else {
        const nuevo = {
          id: Date.now().toString(),
          titulo,
          fecha,
          hora,
          descripcion
        };
        eventos.push(nuevo);
      }

      guardarEventos(eventos);
      limpiarFormulario();
      renderEventos();
    });

    document.getElementById("limpiarBtn").addEventListener("click", () => {
      limpiarFormulario();
    });

    document.getElementById("filtroFecha").addEventListener("change", () => {
      renderEventos();
    });

    document.getElementById("limpiarFiltro").addEventListener("click", () => {
      document.getElementById("filtroFecha").value = "";
      renderEventos();
    });

    // Inicializar con la fecha de hoy en el formulario
    (function init() {
      const hoy = new Date();
      const yyyy = hoy.getFullYear();
      const mm = String(hoy.getMonth() + 1).padStart(2, "0");
      const dd = String(hoy.getDate()).padStart(2, "0");
      document.getElementById("fecha").value = `${yyyy}-${mm}-${dd}`;
      renderEventos();
    })();
  </script>
</body>
</html>

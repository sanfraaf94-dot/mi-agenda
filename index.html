<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Tareas Finanzas - IDB</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #050509;
      --bg-soft: #0b0b10;
      --card: #050509;
      --card-soft: #111119;
      --accent: #a855f7;
      --accent-soft: rgba(168, 85, 247, 0.12);
      --border: #262630;
      --text: #f9fafb;
      --muted: #9ca3af;
      --danger: #f97373;
      --radius: 12px;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, #111827 0, #020617 40%),
        radial-gradient(circle at bottom, #000 0, #020617 55%);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 1280px;
      background: radial-gradient(circle at top left, #020617 0, #020617 65%);
      border-radius: 24px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      box-shadow:
        0 28px 80px rgba(0, 0, 0, 0.95),
        0 0 0 1px rgba(15, 23, 42, 0.9);
      overflow: hidden;
      backdrop-filter: blur(22px);
    }

    .app-header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.25);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background:
        radial-gradient(circle at top left, #111827 0, #020617 60%),
        linear-gradient(to right, rgba(168, 85, 247, 0.18), transparent);
    }

    .app-title {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .app-title h1 {
      font-size: 1.5rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #fefce8;
      font-weight: 600;
    }

    .app-title h1 span.accent {
      color: var(--accent);
    }

    .app-date {
      font-size: 0.9rem;
      color: var(--muted);
      text-align: right;
      display: flex;
      flex-direction: column;
      gap: 2px;
      align-items: flex-end;
    }

    .app-date-main {
      font-size: 0.9rem;
      color: #e5e7eb;
    }

    .app-date-sub {
      font-size: 0.78rem;
      color: #9ca3af;
    }

    .app-body {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 2fr);
      gap: 1px;
      background: #020617;
    }

    .panel {
      padding: 18px;
      background: radial-gradient(circle at top, #020617 0, #020617 70%);
    }

    .panel + .panel {
      border-left: 1px solid rgba(15, 23, 42, 0.9);
    }

    @media (max-width: 900px) {
      body { padding: 12px; }
      .app-body { grid-template-columns: 1fr; }
      .panel + .panel {
        border-left: none;
        border-top: 1px solid rgba(15, 23, 42, 0.9);
      }
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .section-title h2 {
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #e5e7eb;
    }

    .section-title span {
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* Acordeón formulario */

    .accordion {
      border-radius: var(--radius);
      border: 1px solid rgba(55, 65, 81, 0.9);
      background: radial-gradient(circle at top left, #020617 0, #020617 65%);
      overflow: hidden;
      margin-bottom: 10px;
    }

    .accordion-header {
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      background: rgba(15, 23, 42, 0.98);
    }

    .accordion-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #e5e7eb;
    }

    .accordion-title span.plus {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: radial-gradient(circle at top left, #a855f7, #7c3aed);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      color: #f9fafb;
    }

    .accordion-sub {
      font-size: 0.7rem;
      color: var(--muted);
    }

    .accordion-arrow {
      font-size: 0.9rem;
      color: #9ca3af;
      transition: transform 0.15s;
    }

    .accordion-header.open .accordion-arrow {
      transform: rotate(90deg);
    }

    .accordion-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.2s ease;
    }

    .accordion-body-inner {
      padding: 10px 12px 12px;
    }

    /* Formulario */

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .field-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .field {
      flex: 1 1 120px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #e5e7eb;
    }

    label span.muted {
      color: var(--muted);
      text-transform: none;
      letter-spacing: normal;
      font-size: 0.7rem;
    }

    input, select, textarea {
      font: inherit;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(55, 65, 81, 0.9);
      background: rgba(3, 7, 18, 0.9);
      color: var(--text);
      outline: none;
      transition: border 0.15s, box-shadow 0.15s, background 0.15s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: rgba(168, 85, 247, 0.9);
      box-shadow: 0 0 0 1px rgba(168, 85, 247, 0.5);
      background: #020617;
    }

    textarea {
      resize: vertical;
      min-height: 60px;
    }

    .hint {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .form-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 7px 14px;
      font: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s, color 0.1s;
    }

    .btn-primary {
      background: radial-gradient(circle at top left, #a855f7, #7c3aed);
      color: #f9fafb;
      box-shadow: 0 10px 25px rgba(168, 85, 247, 0.5);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 35px rgba(168, 85, 247, 0.75);
    }

    .btn-secondary {
      background: rgba(17, 24, 39, 0.95);
      color: #e5e7eb;
      border: 1px solid rgba(55, 65, 81, 0.9);
    }

    .btn-secondary:hover {
      background: rgba(31, 41, 55, 1);
    }

    .btn-danger {
      background: rgba(248, 113, 113, 0.18);
      color: #fecaca;
      border: 1px solid rgba(248, 113, 113, 0.8);
    }

    .btn-danger:hover {
      background: rgba(248, 113, 113, 0.35);
    }

    .btn-toggle-view {
      font-size: 0.78rem;
      padding: 5px 10px;
    }

    .btn-toggle-view.active {
      border-color: rgba(168, 85, 247, 0.9);
      background: rgba(24, 24, 27, 0.95);
      color: #fefce8;
      box-shadow: 0 0 0 1px rgba(168, 85, 247, 0.6);
    }

    /* Etiquetas / categorías */

    .tag-pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 0.75rem;
      border: 1px solid transparent;
      cursor: pointer;
      background: rgba(17, 24, 39, 0.9);
      color: #e5e7eb;
      gap: 5px;
      margin: 2px 4px 2px 0;
    }

    .tag-pill span.dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: currentColor;
    }

    .tag-doctores      { color: #fb7185; }
    .tag-facturacion   { color: #38bdf8; }
    .tag-contabilidad  { color: #a855f7; }
    .tag-impuestos     { color: #facc15; }
    .tag-banco         { color: #22c55e; }
    .tag-liquidaciones { color: #f97316; }
    .tag-personal      { color: #f9a8d4; }
    .tag-seguros       { color: #67e8f9; }
    .tag-proveedores   { color: #f472b6; }
    .tag-otros         { color: #9ca3af; }
    .tag-vacaciones    { color: #22c55e; }

    /* Panel recordatorios */

    .reminders {
      margin-bottom: 10px;
      border-radius: var(--radius);
      padding: 10px 10px 8px;
      background: radial-gradient(circle at top left, #020617 0, #020617 70%);
      border: 1px solid rgba(55, 65, 81, 0.9);
    }

    .reminders-title {
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #e5e7eb;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .reminders-subtitle {
      font-size: 0.72rem;
      color: var(--muted);
    }

    .reminders-group-title {
      font-size: 0.78rem;
      color: #f9fafb;
      margin-top: 4px;
      margin-bottom: 3px;
    }

    .reminders-list {
      list-style: none;
      font-size: 0.75rem;
      margin-left: 4px;
    }

    .reminder-item {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      padding: 3px 8px;
      cursor: pointer;
      border-radius: 999px;
      align-items: center;
      margin-bottom: 2px;
      border: 1px solid transparent;
    }

    .reminder-item span.title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .reminder-item span.time {
      color: #f9fafb;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }

    .reminders-empty {
      font-size: 0.75rem;
      color: #6b7280;
      padding: 2px 0 4px;
    }

    /* Colores recordatorios según etiqueta */

    .reminder-doctores      { background: rgba(248, 113, 150, 0.15); border-color: rgba(248, 113, 150, 0.4);}
    .reminder-facturacion   { background: rgba(56, 189, 248, 0.15);  border-color: rgba(56, 189, 248, 0.4);}
    .reminder-contabilidad  { background: rgba(168, 85, 247, 0.18);  border-color: rgba(168, 85, 247, 0.45);}
    .reminder-impuestos     { background: rgba(250, 204, 21, 0.15);  border-color: rgba(250, 204, 21, 0.5);}
    .reminder-banco         { background: rgba(34, 197, 94, 0.15);   border-color: rgba(34, 197, 94, 0.45);}
    .reminder-liquidaciones { background: rgba(249, 115, 22, 0.18);  border-color: rgba(249, 115, 22, 0.5);}
    .reminder-personal      { background: rgba(244, 114, 182, 0.18); border-color: rgba(244, 114, 182, 0.45);}
    .reminder-seguros       { background: rgba(45, 212, 191, 0.15);  border-color: rgba(45, 212, 191, 0.45);}
    .reminder-proveedores   { background: rgba(244, 114, 182, 0.18); border-color: rgba(244, 114, 182, 0.45);}
    .reminder-otros         { background: rgba(75, 85, 99, 0.2);     border-color: rgba(75, 85, 99, 0.5);}
    .reminder-vacaciones    { background: rgba(22, 163, 74, 0.18);   border-color: rgba(22, 163, 74, 0.5);}

    /* Toolbar y stats */

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .date-controls {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 6px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(55, 65, 81, 0.9);
    }

    .date-controls button {
      padding: 4px 8px;
      font-size: 0.75rem;
      text-transform: none;
      letter-spacing: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--text);
    }

    .date-controls button:hover {
      background: rgba(55, 65, 81, 0.8);
    }

    .date-select-day {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .date-select-day input[type="date"] {
      padding: 4px 8px;
      font-size: 0.78rem;
      border-radius: 999px;
    }

    .filter-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .filter-select {
      max-width: 190px;
    }

    select.filter-select {
      font-size: 0.8rem;
    }

    .stats {
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 4px;
    }

    /* Vista toggle */

    .view-toggle {
      display: inline-flex;
      border-radius: 999px;
      padding: 3px;
      background: rgba(12, 20, 38, 0.95);
      border: 1px solid rgba(55, 65, 81, 0.95);
      gap: 3px;
    }

    /* Calendario semanal */

    .week-grid {
      margin-top: 10px;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid rgba(31, 41, 55, 1);
      background: radial-gradient(circle at top left, #020617 0, #020617 60%);
      box-shadow:
        0 18px 40px rgba(15, 23, 42, 0.9),
        0 0 0 1px rgba(15, 23, 42, 0.9);
    }

    .week-header {
      display: grid;
      grid-template-columns: 60px repeat(7, minmax(0, 1fr));
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      background: rgba(15, 23, 42, 0.98);
      border-bottom: 1px solid rgba(31, 41, 55, 1);
    }

    .week-header div {
      padding: 10px 8px;
      border-right: 1px solid rgba(31, 41, 55, 1);
      color: #d1d5db;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .day-name { font-weight: 500; }
    .day-date { font-size: 0.78rem; color: #9ca3af; }

    .today-pill {
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(168, 85, 247, 0.2);
      color: var(--accent);
      border: 1px solid rgba(168, 85, 247, 0.7);
      align-self: flex-start;
      margin-top: 3px;
    }

    .week-body {
      display: grid;
      grid-template-columns: 60px repeat(7, minmax(0, 1fr));
      max-height: 520px;
      overflow: auto;
      font-size: 0.78rem;
    }

    .hour-label {
      padding: 4px 6px;
      border-right: 1px solid rgba(31, 41, 55, 1);
      border-bottom: 1px solid rgba(31, 41, 55, 1);
      color: #6b7280;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
    }

    .cell {
      border-right: 1px solid rgba(31, 41, 55, 1);
      border-bottom: 1px solid rgba(31, 41, 55, 1);
      padding: 2px 2px 4px;
      min-height: 32px;
      position: relative;
      background: rgba(15, 23, 42, 0.96);
    }

    /* Vista diaria */

    .day-view {
      margin-top: 10px;
      border-radius: var(--radius);
      border: 1px solid rgba(31, 41, 55, 1);
      background: radial-gradient(circle at top, #020617 0, #020617 60%);
      overflow: hidden;
    }

    .day-view-header {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(31, 41, 55, 1);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.85rem;
    }

    .day-view-header-main {
      font-weight: 500;
      color: #e5e7eb;
      text-transform: capitalize;
    }

    .day-view-header-sub {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .day-view-body {
      max-height: 520px;
      overflow: auto;
    }

    .day-slot {
      border-top: 1px solid rgba(31, 41, 55, 1);
      display: flex;
      align-items: flex-start;
      padding: 6px 10px 6px;
      gap: 8px;
    }

    .day-slot:first-child {
      border-top: none;
    }

    .day-slot-hour {
      width: 54px;
      font-size: 0.75rem;
      color: #6b7280;
      text-align: right;
      padding-top: 3px;
      font-variant-numeric: tabular-nums;
    }

    .day-slot-events {
      flex: 1;
      min-height: 22px;
    }

    /* Event chips */

    .event-chip {
      position: relative;
      display: block;
      padding: 4px 6px;
      border-radius: 7px;
      background: rgba(17, 24, 39, 0.96);
      border: 1px solid rgba(51, 65, 85, 0.95);
      margin-bottom: 3px;
      cursor: pointer;
      color: #e5e7eb;
      overflow: hidden;
      transition: transform 0.1s, box-shadow 0.15s, border-color 0.1s,
        background 0.1s;
      backdrop-filter: blur(10px);
    }

    .event-chip.done {
      opacity: 0.7;
      border-style: dashed;
      border-color: rgba(34, 197, 94, 0.9);
    }

    .event-chip:hover {
      transform: translateY(-0.5px);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.9);
      border-color: rgba(168, 85, 247, 0.7);
    }

    .event-chip-title {
      font-size: 0.78rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .event-chip-meta {
      font-size: 0.7rem;
      color: #9ca3af;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1px;
      gap: 4px;
    }

    .event-chip-tag {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.9;
    }

    .event-chip-tag-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: currentColor;
    }

    .event-chip-time {
      font-variant-numeric: tabular-nums;
    }

    .event-chip-status {
      font-size: 0.7rem;
      margin-left: 4px;
      color: #22c55e;
    }

    .event-chip-status.pending {
      color: #f97316;
    }

    .event-chip-desc {
      font-size: 0.7rem;
      color: #9ca3af;
      margin-top: 2px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .empty-label {
      text-align: center;
      font-size: 0.8rem;
      color: #6b7280;
      padding: 10px 6px 12px;
    }

    @media (max-width: 900px) {
      .week-header {
        grid-template-columns: 45px repeat(7, minmax(0, 1fr));
      }
      .week-body {
        grid-template-columns: 45px repeat(7, minmax(0, 1fr));
      }
      .event-chip-desc {
        display: none;
      }
    }

    @media (max-width: 700px) {
      .week-header {
        grid-template-columns: 45px repeat(3, minmax(0, 1fr));
      }
      .week-body {
        grid-template-columns: 45px repeat(3, minmax(0, 1fr));
      }
    }

    /* Modal */

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.92);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 30;
    }

    .modal {
      width: 100%;
      max-width: 420px;
      background: radial-gradient(circle at top left, #020617 0, #020617 70%);
      border-radius: 18px;
      border: 1px solid rgba(55, 65, 81, 1);
      padding: 16px 16px 12px;
      box-shadow:
        0 24px 50px rgba(0, 0, 0, 0.9),
        0 0 0 1px rgba(15, 23, 42, 0.95);
      animation: fadeIn 0.15s ease-out;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
    }

    .modal-title {
      font-weight: 600;
      font-size: 1rem;
    }

    .modal-meta {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .modal-desc {
      font-size: 0.85rem;
      color: #d1d5db;
      margin-bottom: 10px;
      white-space: pre-wrap;
    }

    .modal-footer {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .modal-footer-left {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .modal-footer-right {
      display: flex;
      gap: 6px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid rgba(55, 65, 81, 0.9);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #e5e7eb;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--accent);
    }

    .btn-icon {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      font-size: 1rem;
      background: transparent;
      color: #9ca3af;
    }

    .btn-icon:hover {
      background: rgba(31, 41, 55, 0.9);
      color: #e5e7eb;
    }

    .status-pill {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border: 1px solid;
    }

    .status-pill.done {
      color: #bbf7d0;
      border-color: #22c55e;
      background: rgba(34, 197, 94, 0.15);
    }

    .status-pill.pending {
      color: #fed7aa;
      border-color: #f97316;
      background: rgba(249, 115, 22, 0.12);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="app-title">
        <h1><span class="accent">Tareas Finanzas</span> – IDB</h1>
      </div>
      <div class="app-date">
        <span class="app-date-main" id="headerTodayLabel"></span>
        <span class="app-date-sub" id="headerWeekRange"></span>
      </div>
    </header>

    <div class="app-body">
      <!-- PANEL IZQUIERDO -->
      <section class="panel">
        <!-- Acordeón nueva tarea -->
        <div class="accordion">
          <div class="accordion-header" id="accordionHeader">
            <div class="accordion-title">
              <span class="plus">+</span>
              Nueva tarea / cita
            </div>
            <div class="accordion-arrow">▶</div>
          </div>
          <div class="accordion-body" id="accordionBody">
            <div class="accordion-body-inner">
              <form id="eventForm">
                <input type="hidden" id="editId" />

                <div class="field-row">
                  <div class="field" style="flex:2;">
                    <label for="titulo">Título</label>
                    <input type="text" id="titulo" placeholder="Ej.: Liquidación IVA, pago proveedores, vacaciones..." required />
                  </div>
                </div>

                <div class="field-row">
                  <div class="field">
                    <label for="fecha">Fecha cita/tarea</label>
                    <input type="date" id="fecha" required />
                  </div>
                  <div class="field">
                    <label for="hora">Hora</label>
                    <input type="time" id="hora" required />
                  </div>
                </div>

                <div class="field-row">
                  <div class="field">
                    <label for="categoria">Etiqueta / Tipo</label>
                    <select id="categoria" required>
                      <option value="">Selecciona una etiqueta</option>
                      <option value="doctores">Doctores</option>
                      <option value="facturacion">Facturación</option>
                      <option value="contabilidad">Contabilidad</option>
                      <option value="impuestos">Impuestos</option>
                      <option value="banco">Banco</option>
                      <option value="liquidaciones">Liquidaciones</option>
                      <option value="personal">Personal / Nómina</option>
                      <option value="seguros">Seguros</option>
                      <option value="proveedores">Proveedores</option>
                      <option value="vacaciones">Vacaciones</option>
                      <option value="otros">Otros</option>
                    </select>
                  </div>
                  <div class="field">
                    <label for="estado">Estado</label>
                    <select id="estado" required>
                      <option value="pendiente">Pendiente</option>
                      <option value="hecho">Hecho</option>
                    </select>
                  </div>
                </div>

                <div class="field-row">
                  <div class="field">
                    <label for="fechaRealizacion">
                      Fecha de realización
                      <span class="muted">(cuando se completa)</span>
                    </label>
                    <input type="date" id="fechaRealizacion" />
                  </div>
                </div>

                <div class="field">
                  <label for="descripcion">
                    Detalles
                    <span class="muted">(datos, importes, contactos, bancos...)</span>
                  </label>
                  <textarea id="descripcion" placeholder="Ej.: importe, nº de factura, banco implicado, proveedor, notas internas..."></textarea>
                </div>

                <div>
                  <label>Atajos de etiqueta</label>
                  <div>
                    <button type="button" class="tag-pill tag-doctores" data-tag="doctores">
                      <span class="dot"></span> Doctores
                    </button>
                    <button type="button" class="tag-pill tag-facturacion" data-tag="facturacion">
                      <span class="dot"></span> Facturación
                    </button>
                    <button type="button" class="tag-pill tag-contabilidad" data-tag="contabilidad">
                      <span class="dot"></span> Contabilidad
                    </button>
                    <button type="button" class="tag-pill tag-impuestos" data-tag="impuestos">
                      <span class="dot"></span> Impuestos
                    </button>
                    <button type="button" class="tag-pill tag-banco" data-tag="banco">
                      <span class="dot"></span> Banco
                    </button>
                    <button type="button" class="tag-pill tag-liquidaciones" data-tag="liquidaciones">
                      <span class="dot"></span> Liquidaciones
                    </button>
                    <button type="button" class="tag-pill tag-personal" data-tag="personal">
                      <span class="dot"></span> Personal / Nómina
                    </button>
                    <button type="button" class="tag-pill tag-seguros" data-tag="seguros">
                      <span class="dot"></span> Seguros
                    </button>
                    <button type="button" class="tag-pill tag-proveedores" data-tag="proveedores">
                      <span class="dot"></span> Proveedores
                    </button>
                    <button type="button" class="tag-pill tag-vacaciones" data-tag="vacaciones">
                      <span class="dot"></span> Vacaciones
                    </button>
                    <button type="button" class="tag-pill tag-otros" data-tag="otros">
                      <span class="dot"></span> Otros
                    </button>
                  </div>
                </div>

                <div class="form-footer">
                  <div class="hint">
                    Todo se guarda localmente en este navegador.
                  </div>
                  <div class="buttons">
                    <button type="button" class="btn-secondary" id="limpiarBtn">
                      Cancelar
                    </button>
                    <button type="submit" class="btn-primary">
                      <span id="submitLabel">Guardar tarea</span>
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>

        <!-- Indicador de edición -->
        <div class="section-title" style="margin-top:6px;">
          <h2>Estado</h2>
          <span id="editIndicator" style="display:none;">Editando tarea</span>
        </div>
      </section>

      <!-- PANEL DERECHO -->
      <section class="panel">
        <!-- RECORDATORIOS -->
        <div class="reminders" id="remindersPanel">
          <div class="reminders-title">
            <span>Recordatorios pendientes</span>
            <span class="reminders-subtitle">Vencidos · Hoy · Mañana</span>
          </div>
          <div id="remindersContent"></div>
        </div>

        <div class="section-title">
          <h2>Agenda</h2>
          <span>Vista semanal o diaria</span>
        </div>

        <div class="toolbar">
          <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            <div class="date-controls">
              <button type="button" id="prevWeekBtn">◀</button>
              <button type="button" id="todayBtn">Hoy</button>
              <button type="button" id="nextWeekBtn">▶</button>
            </div>
            <div class="view-toggle">
              <button type="button" class="btn-secondary btn-toggle-view active" id="viewWeekBtn">
                Semana
              </button>
              <button type="button" class="btn-secondary btn-toggle-view" id="viewDayBtn">
                Día
              </button>
            </div>
            <div class="date-select-day">
              <span>Día:</span>
              <input type="date" id="daySelector" />
            </div>
          </div>
          <div class="filter-bar">
            <select id="filterCategoria" class="filter-select">
              <option value="">Todas las etiquetas</option>
              <option value="doctores">Doctores</option>
              <option value="facturacion">Facturación</option>
              <option value="contabilidad">Contabilidad</option>
              <option value="impuestos">Impuestos</option>
              <option value="banco">Banco</option>
              <option value="liquidaciones">Liquidaciones</option>
              <option value="personal">Personal / Nómina</option>
              <option value="seguros">Seguros</option>
              <option value="proveedores">Proveedores</option>
              <option value="vacaciones">Vacaciones</option>
              <option value="otros">Otros</option>
            </select>
            <button type="button" class="btn-secondary" id="clearFilterBtn">
              Limpiar filtro
            </button>
          </div>
        </div>

        <div class="stats">
          <span>Total semana: <strong id="statsTotal">0</strong></span>
          <span>|</span>
          <span>Filtrados: <strong id="statsFiltered">0</strong></span>
        </div>

        <!-- Vista SEMANAL -->
        <div class="week-grid" id="weekView">
          <div class="week-header" id="weekHeader"></div>
          <div class="week-body" id="weekBody"></div>
        </div>

        <!-- Vista DIARIA -->
        <div class="day-view" id="dayView" style="display:none;">
          <div class="day-view-header">
            <div>
              <div class="day-view-header-main" id="dayViewMain"></div>
              <div class="day-view-header-sub" id="dayViewSub"></div>
            </div>
          </div>
          <div class="day-view-body" id="dayViewBody"></div>
        </div>
      </section>
    </div>
  </div>

  <!-- MODAL DETALLE EVENTO -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <div>
          <div class="modal-title" id="modalTitle"></div>
          <div class="modal-meta" id="modalMeta"></div>
        </div>
        <button type="button" class="btn-icon" id="modalCloseBtn" aria-label="Cerrar">
          ✕
        </button>
      </div>
      <div class="modal-desc" id="modalDesc"></div>
      <div class="modal-footer">
        <div class="modal-footer-left">
          <span class="badge" id="modalTagBadge">
            <span class="badge-dot"></span>
            <span id="modalTagLabel">Etiqueta</span>
          </span>
          <span class="status-pill" id="modalStatusPill"></span>
          <span class="hint" id="modalRealizacionHint"></span>
        </div>
        <div class="modal-footer-right">
          <button type="button" class="btn-secondary" id="modalToggleDoneBtn">
            Hecho / pendiente
          </button>
          <button type="button" class="btn-secondary" id="modalEditBtn">
            Editar
          </button>
          <button type="button" class="btn-danger" id="modalDeleteBtn">
            Eliminar
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "agenda_finanzas_idb_v2";

    const CATEGORIES = {
      doctores:     { label: "Doctores", class: "tag-doctores",      rClass:"reminder-doctores" },
      facturacion:  { label: "Facturación", class: "tag-facturacion", rClass:"reminder-facturacion" },
      contabilidad: { label: "Contabilidad", class: "tag-contabilidad", rClass:"reminder-contabilidad" },
      impuestos:    { label: "Impuestos", class: "tag-impuestos",    rClass:"reminder-impuestos" },
      banco:        { label: "Banco", class: "tag-banco",            rClass:"reminder-banco" },
      liquidaciones:{ label: "Liquidaciones", class: "tag-liquidaciones", rClass:"reminder-liquidaciones" },
      personal:     { label: "Personal / Nómina", class: "tag-personal", rClass:"reminder-personal" },
      seguros:      { label: "Seguros", class: "tag-seguros",        rClass:"reminder-seguros" },
      proveedores:  { label: "Proveedores", class: "tag-proveedores", rClass:"reminder-proveedores" },
      vacaciones:   { label: "Vacaciones", class: "tag-vacaciones",  rClass:"reminder-vacaciones" },
      otros:        { label: "Otros", class: "tag-otros",            rClass:"reminder-otros" }
    };

    const HOURS = Array.from({ length: 13 }, (_, i) => 8 + i); // 08–20

    function readEvents() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      try {
        const data = JSON.parse(raw);
        return Array.isArray(data) ? data : [];
      } catch {
        return [];
      }
    }
    function saveEvents(events) { localStorage.setItem(STORAGE_KEY, JSON.stringify(events)); }
    function sortEvents(events) {
      return events.sort((a, b) => {
        const ak = a.fecha + " " + a.hora + " " + a.titulo;
        const bk = b.fecha + " " + b.hora + " " + b.titulo;
        return ak.localeCompare(bk);
      });
    }

    function getWeekStart(date) {
      const d = new Date(date);
      const day = d.getDay(); // 0 dom
      const diff = (day === 0 ? -6 : 1) - day;
      d.setDate(d.getDate() + diff);
      d.setHours(0, 0, 0, 0);
      return d;
    }
    function addDays(date, days) { const d = new Date(date); d.setDate(d.getDate() + days); return d; }
    function formatDateISO(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }
    function formatDateHuman(date) {
      return date.toLocaleDateString("es-ES", {
        day: "2-digit", month: "short", year: "numeric"
      });
    }
    function formatWeekRange(weekStart) {
      const s = new Date(weekStart);
      const e = addDays(s, 6);
      const o = { day: "2-digit", month: "short" };
      const ss = s.toLocaleDateString("es-ES", o);
      const es = e.toLocaleDateString("es-ES", {
        ...o, year: s.getFullYear() === e.getFullYear() ? undefined : "numeric"
      });
      return `${ss} – ${es} · ${e.getFullYear()}`;
    }

    let currentWeekStart = getWeekStart(new Date());
    let currentFilterCategory = "";
    let currentView = "week";

    const weekHeaderEl = document.getElementById("weekHeader");
    const weekBodyEl = document.getElementById("weekBody");
    const filterSelectEl = document.getElementById("filterCategoria");
    const statsTotalEl = document.getElementById("statsTotal");
    const statsFilteredEl = document.getElementById("statsFiltered");
    const headerTodayLabelEl = document.getElementById("headerTodayLabel");
    const headerWeekRangeEl = document.getElementById("headerWeekRange");
    const remindersContentEl = document.getElementById("remindersContent");

    const weekViewEl = document.getElementById("weekView");
    const dayViewEl = document.getElementById("dayView");
    const dayViewMainEl = document.getElementById("dayViewMain");
    const dayViewSubEl = document.getElementById("dayViewSub");
    const dayViewBodyEl = document.getElementById("dayViewBody");
    const viewWeekBtn = document.getElementById("viewWeekBtn");
    const viewDayBtn = document.getElementById("viewDayBtn");
    const daySelectorEl = document.getElementById("daySelector");

    const formEl = document.getElementById("eventForm");
    const tituloEl = document.getElementById("titulo");
    const fechaEl = document.getElementById("fecha");
    const horaEl = document.getElementById("hora");
    const categoriaEl = document.getElementById("categoria");
    const estadoEl = document.getElementById("estado");
    const fechaRealizacionEl = document.getElementById("fechaRealizacion");
    const descEl = document.getElementById("descripcion");
    const editIdEl = document.getElementById("editId");
    const submitLabelEl = document.getElementById("submitLabel");
    const editIndicatorEl = document.getElementById("editIndicator");

    const modalBackdropEl = document.getElementById("modalBackdrop");
    const modalTitleEl = document.getElementById("modalTitle");
    const modalMetaEl = document.getElementById("modalMeta");
    const modalDescEl = document.getElementById("modalDesc");
    const modalTagBadgeEl = document.getElementById("modalTagBadge");
    const modalTagLabelEl = document.getElementById("modalTagLabel");
    const modalStatusPillEl = document.getElementById("modalStatusPill");
    const modalRealizacionHintEl = document.getElementById("modalRealizacionHint");
    const modalCloseBtn = document.getElementById("modalCloseBtn");
    const modalEditBtn = document.getElementById("modalEditBtn");
    const modalDeleteBtn = document.getElementById("modalDeleteBtn");
    const modalToggleDoneBtn = document.getElementById("modalToggleDoneBtn");

    const accordionHeaderEl = document.getElementById("accordionHeader");
    const accordionBodyEl = document.getElementById("accordionBody");

    let accordionOpen = false;
    let modalCurrentId = null;

    function toggleAccordion(forceOpen = null) {
      const content = accordionBodyEl;
      const header = accordionHeaderEl;

      const shouldOpen = forceOpen !== null ? forceOpen : !accordionOpen;
      accordionOpen = shouldOpen;

      if (shouldOpen) {
        const inner = content.querySelector(".accordion-body-inner");
        const h = inner.scrollHeight;
        content.style.maxHeight = h + "px";
        header.classList.add("open");
      } else {
        content.style.maxHeight = "0px";
        header.classList.remove("open");
      }
    }

    accordionHeaderEl.addEventListener("click", () => toggleAccordion());

    function renderHeader() {
      const today = new Date();
      headerTodayLabelEl.textContent = today.toLocaleDateString("es-ES", {
        weekday: "long", day: "2-digit", month: "long", year: "numeric"
      });
      headerWeekRangeEl.textContent = formatWeekRange(currentWeekStart);
    }

    function renderWeekHeader() {
      weekHeaderEl.innerHTML = "";
      const hourCol = document.createElement("div");
      hourCol.textContent = "Hora";
      weekHeaderEl.appendChild(hourCol);

      const todayISO = formatDateISO(new Date());
      for (let i = 0; i < 7; i++) {
        const d = addDays(currentWeekStart, i);
        const col = document.createElement("div");
        const name = document.createElement("span");
        name.className = "day-name";
        name.textContent = d.toLocaleDateString("es-ES", { weekday: "short" });
        const date = document.createElement("span");
        date.className = "day-date";
        date.textContent = d.toLocaleDateString("es-ES", {
          day: "2-digit", month: "short"
        });
        col.appendChild(name);
        col.appendChild(date);
        if (formatDateISO(d) === todayISO) {
          const pill = document.createElement("span");
          pill.className = "today-pill";
          pill.textContent = "Hoy";
          col.appendChild(pill);
        }
        weekHeaderEl.appendChild(col);
      }
    }

    function createEventChip(ev) {
      const chip = document.createElement("div");
      chip.className = "event-chip";
      if (ev.estado === "hecho") chip.classList.add("done");
      chip.dataset.id = ev.id;

      const title = document.createElement("div");
      title.className = "event-chip-title";
      title.textContent = ev.titulo;

      const meta = document.createElement("div");
      meta.className = "event-chip-meta";

      const catSpan = document.createElement("span");
      catSpan.className = "event-chip-tag";
      const catInfo = CATEGORIES[ev.categoria];
      if (catInfo) {
        catSpan.classList.add(catInfo.class);
        const dot = document.createElement("span");
        dot.className = "event-chip-tag-dot";
        const label = document.createElement("span");
        label.textContent = catInfo.label;
        catSpan.appendChild(dot);
        catSpan.appendChild(label);
      } else {
        catSpan.textContent = "Sin etiqueta";
      }

      const rightMeta = document.createElement("span");
      const timeSpan = document.createElement("span");
      timeSpan.className = "event-chip-time";
      timeSpan.textContent = ev.hora;
      const statusSpan = document.createElement("span");
      statusSpan.className = "event-chip-status " +
        (ev.estado === "hecho" ? "done" : "pending");
      statusSpan.textContent = ev.estado === "hecho" ? "Hecho" : "Pendiente";

      rightMeta.appendChild(timeSpan);
      rightMeta.appendChild(statusSpan);

      meta.appendChild(catSpan);
      meta.appendChild(rightMeta);

      chip.appendChild(title);
      chip.appendChild(meta);

      if (ev.descripcion) {
        const desc = document.createElement("div");
        desc.className = "event-chip-desc";
        desc.textContent = ev.descripcion;
        chip.appendChild(desc);
      }

      chip.addEventListener("click", () => openModal(ev.id));
      return chip;
    }

    function renderWeekBody() {
      const all = sortEvents(readEvents());
      const weekEvents = all.filter(ev => {
        const d = new Date(ev.fecha + "T00:00:00");
        return d >= currentWeekStart && d < addDays(currentWeekStart, 7);
      });

      statsTotalEl.textContent = weekEvents.length;
      const filtered = currentFilterCategory
        ? weekEvents.filter(ev => ev.categoria === currentFilterCategory)
        : weekEvents;
      statsFilteredEl.textContent = filtered.length;

      const byDayHour = {};
      filtered.forEach(ev => {
        const key = `${ev.fecha}-${ev.hora.slice(0, 2)}`;
        if (!byDayHour[key]) byDayHour[key] = [];
        byDayHour[key].push(ev);
      });

      weekBodyEl.innerHTML = "";

      for (const hour of HOURS) {
        const hourLabel = document.createElement("div");
        hourLabel.className = "hour-label";
        hourLabel.textContent = `${String(hour).padStart(2, "0")}:00`;
        weekBodyEl.appendChild(hourLabel);

        for (let i = 0; i < 7; i++) {
          const d = addDays(currentWeekStart, i);
          const dateISO = formatDateISO(d);
          const key = `${dateISO}-${String(hour).padStart(2, "0")}`;
          const cell = document.createElement("div");
          cell.className = "cell";

          const evs = byDayHour[key] || [];
          evs.forEach(ev => cell.appendChild(createEventChip(ev)));

          weekBodyEl.appendChild(cell);
        }
      }

      if (!weekEvents.length) {
        const row = document.createElement("div");
        row.className = "empty-label";
        row.textContent =
          "No hay tareas esta semana. Crea una nueva en el panel izquierdo.";
        row.style.gridColumn = `1 / span 8`;
        weekBodyEl.appendChild(row);
      }
    }

    // ---- Vista diaria ----
    function renderDayView() {
      const selectedDate = daySelectorEl.value || formatDateISO(new Date());
      const d = new Date(selectedDate + "T00:00:00");
      dayViewMainEl.textContent = d.toLocaleDateString("es-ES", {
        weekday: "long",
        day: "2-digit",
        month: "long"
      });
      dayViewSubEl.textContent = d.getFullYear();

      const all = sortEvents(readEvents());
      let dayEvents = all.filter(ev => ev.fecha === selectedDate);
      if (currentFilterCategory) {
        dayEvents = dayEvents.filter(ev => ev.categoria === currentFilterCategory);
      }

      dayViewBodyEl.innerHTML = "";

      if (!dayEvents.length) {
        const empty = document.createElement("div");
        empty.className = "empty-label";
        empty.textContent = "No hay tareas para este día.";
        dayViewBodyEl.appendChild(empty);
        return;
      }

      const byHour = {};
      dayEvents.forEach(ev => {
        const hour = ev.hora.slice(0, 2);
        if (!byHour[hour]) byHour[hour] = [];
        byHour[hour].push(ev);
      });

      HOURS.forEach(h => {
        const hStr = String(h).padStart(2, "0");
        const slot = document.createElement("div");
        slot.className = "day-slot";

        const hourLabel = document.createElement("div");
        hourLabel.className = "day-slot-hour";
        hourLabel.textContent = `${hStr}:00`;

        const evContainer = document.createElement("div");
        evContainer.className = "day-slot-events";

        const evs = byHour[hStr] || [];
        evs.forEach(ev => evContainer.appendChild(createEventChip(ev)));

        slot.appendChild(hourLabel);
        slot.appendChild(evContainer);
        dayViewBodyEl.appendChild(slot);
      });
    }

    // ----- RECORDATORIOS -----
    function renderReminders() {
      const all = sortEvents(readEvents()).filter(ev => ev.estado !== "hecho");
      const today = new Date();
      today.setHours(0,0,0,0);
      const todayISO = formatDateISO(today);
      const tomorrow = addDays(today,1);
      const tomorrowISO = formatDateISO(tomorrow);

      const vencidos = [];
      const deHoy = [];
      const deManiana = [];

      all.forEach(ev => {
        if (!ev.fecha) return;
        if (ev.fecha < todayISO) vencidos.push(ev);
        else if (ev.fecha === todayISO) deHoy.push(ev);
        else if (ev.fecha === tomorrowISO) deManiana.push(ev);
      });

      const hasAny = vencidos.length || deHoy.length || deManiana.length;

      if (!hasAny) {
        remindersContentEl.innerHTML =
          '<div class="reminders-empty">Sin pendientes vencidos, de hoy o mañana.</div>';
        return;
      }

      const createGroup = (titulo, lista) => {
        if (!lista.length) return "";
        const items = lista
          .map(ev => {
            const cat = CATEGORIES[ev.categoria];
            const catLabel = cat ? ` · ${cat.label}` : "";
            const rClass = cat && cat.rClass ? cat.rClass : "";
            return `
              <li class="reminder-item ${rClass}" data-id="${ev.id}">
                <span class="title">${ev.titulo}${catLabel}</span>
                <span class="time">${ev.hora}</span>
              </li>`;
          })
          .join("");
        return `
          <div class="reminders-group">
            <div class="reminders-group-title">${titulo}</div>
            <ul class="reminders-list">
              ${items}
            </ul>
          </div>`;
      };

      remindersContentEl.innerHTML =
        createGroup("Vencidos", vencidos) +
        createGroup("Hoy", deHoy) +
        createGroup("Mañana", deManiana);

      remindersContentEl
        .querySelectorAll(".reminder-item")
        .forEach(item => {
          item.addEventListener("click", () => {
            const id = item.dataset.id;
            openModal(id);
          });
        });
    }

    function renderAll() {
      renderHeader();
      renderWeekHeader();
      renderWeekBody();
      renderReminders();
      if (currentView === "day") renderDayView();
    }

    function resetForm() {
      formEl.reset();
      editIdEl.value = "";
      submitLabelEl.textContent = "Guardar tarea";
      editIndicatorEl.style.display = "none";
      setTodayAsDefault();
      estadoEl.value = "pendiente";
    }

    function loadEventIntoForm(id) {
      const events = readEvents();
      const ev = events.find(e => e.id === id);
      if (!ev) return;
      tituloEl.value = ev.titulo;
      fechaEl.value = ev.fecha;
      horaEl.value = ev.hora;
      categoriaEl.value = ev.categoria || "";
      estadoEl.value = ev.estado || "pendiente";
      fechaRealizacionEl.value = ev.fechaRealizacion || "";
      descEl.value = ev.descripcion || "";
      editIdEl.value = ev.id;
      submitLabelEl.textContent = "Actualizar tarea";
      editIndicatorEl.style.display = "inline";
      toggleAccordion(true);
      window.scrollTo({ top: 0, behavior: "smooth" });
      if (currentView === "day") renderDayView();
    }

    formEl.addEventListener("submit", e => {
      e.preventDefault();
      const titulo = tituloEl.value.trim();
      const fecha = fechaEl.value;
      const hora = horaEl.value;
      const categoria = categoriaEl.value;
      const estado = estadoEl.value || "pendiente";
      const fechaRealizacion = fechaRealizacionEl.value || "";
      const descripcion = descEl.value.trim();
      const editId = editIdEl.value;

      if (!titulo || !fecha || !hora || !categoria) {
        alert("Título, fecha, hora y etiqueta son obligatorios.");
        return;
      }

      let events = readEvents();
      if (editId) {
        events = events.map(ev =>
          ev.id === editId
            ? { ...ev, titulo, fecha, hora, categoria, estado, fechaRealizacion, descripcion }
            : ev
        );
      } else {
        const nuevo = {
          id: Date.now().toString(),
          titulo,
          fecha,
          hora,
          categoria,
          estado,
          fechaRealizacion,
          descripcion
        };
        events.push(nuevo);
      }

      saveEvents(events);
      resetForm();
      renderAll();
    });

    document.getElementById("limpiarBtn").addEventListener("click", resetForm);

    document.querySelectorAll(".tag-pill[data-tag]").forEach(btn => {
      btn.addEventListener("click", () => {
        const tag = btn.dataset.tag;
        categoriaEl.value = tag;
      });
    });

    document.getElementById("prevWeekBtn").addEventListener("click", () => {
      currentWeekStart = addDays(currentWeekStart, -7);
      renderAll();
    });
    document.getElementById("nextWeekBtn").addEventListener("click", () => {
      currentWeekStart = addDays(currentWeekStart, 7);
      renderAll();
    });
    document.getElementById("todayBtn").addEventListener("click", () => {
      const today = new Date();
      currentWeekStart = getWeekStart(today);
      setTodayAsDefault();
      daySelectorEl.value = formatDateISO(today);
      renderAll();
    });

    filterSelectEl.addEventListener("change", () => {
      currentFilterCategory = filterSelectEl.value;
      renderWeekBody();
      if (currentView === "day") renderDayView();
    });
    document.getElementById("clearFilterBtn").addEventListener("click", () => {
      currentFilterCategory = "";
      filterSelectEl.value = "";
      renderWeekBody();
      if (currentView === "day") renderDayView();
    });

    // Selector de día para vista diaria
    daySelectorEl.addEventListener("change", () => {
      if (currentView === "day") renderDayView();
    });

    // Cambiar vista semana/día
    function setView(view) {
      currentView = view;
      if (view === "week") {
        weekViewEl.style.display = "";
        dayViewEl.style.display = "none";
        viewWeekBtn.classList.add("active");
        viewDayBtn.classList.remove("active");
      } else {
        weekViewEl.style.display = "none";
        dayViewEl.style.display = "";
        viewWeekBtn.classList.remove("active");
        viewDayBtn.classList.add("active");
        renderDayView();
      }
    }

    viewWeekBtn.addEventListener("click", () => setView("week"));
    viewDayBtn.addEventListener("click", () => setView("day"));

    // Modal
    function openModal(id) {
      modalCurrentId = id;
      const events = readEvents();
      const ev = events.find(e => e.id === id);
      if (!ev) return;

      modalTitleEl.textContent = ev.titulo;
      const d = new Date(ev.fecha + "T00:00:00");
      modalMetaEl.textContent = `${formatDateHuman(d)} · ${ev.hora}`;
      modalDescEl.textContent =
        ev.descripcion && ev.descripcion.trim()
          ? ev.descripcion
          : "Sin detalles adicionales.";

      const catInfo = CATEGORIES[ev.categoria];
      if (catInfo) {
        modalTagBadgeEl.className = "badge " + catInfo.class;
        modalTagLabelEl.textContent = catInfo.label;
      } else {
        modalTagBadgeEl.className = "badge";
        modalTagLabelEl.textContent = "Sin etiqueta";
      }

      if (ev.estado === "hecho") {
        modalStatusPillEl.className = "status-pill done";
        modalStatusPillEl.textContent = "Hecho";
      } else {
        modalStatusPillEl.className = "status-pill pending";
        modalStatusPillEl.textContent = "Pendiente";
      }

      if (ev.fechaRealizacion) {
        const dr = new Date(ev.fechaRealizacion + "T00:00:00");
        modalRealizacionHintEl.textContent =
          "Realizado el " + formatDateHuman(dr);
      } else {
        modalRealizacionHintEl.textContent = "";
      }

      modalBackdropEl.style.display = "flex";
    }

    function closeModal() {
      modalBackdropEl.style.display = "none";
      modalCurrentId = null;
    }

    modalCloseBtn.addEventListener("click", closeModal);
    modalBackdropEl.addEventListener("click", e => {
      if (e.target === modalBackdropEl) closeModal();
    });

    modalEditBtn.addEventListener("click", () => {
      if (!modalCurrentId) return;
      loadEventIntoForm(modalCurrentId);
      closeModal();
    });

    modalDeleteBtn.addEventListener("click", () => {
      if (!modalCurrentId) return;
      if (!confirm("¿Seguro que quieres eliminar esta tarea?")) return;
      let events = readEvents();
      events = events.filter(ev => ev.id !== modalCurrentId);
      saveEvents(events);
      closeModal();
      renderAll();
    });

    modalToggleDoneBtn.addEventListener("click", () => {
      if (!modalCurrentId) return;
      let events = readEvents();
      const now = new Date();
      const todayISO = formatDateISO(now);
      events = events.map(ev => {
        if (ev.id !== modalCurrentId) return ev;
        const nuevoEstado = ev.estado === "hecho" ? "pendiente" : "hecho";
        const nuevaFechaReal =
          nuevoEstado === "hecho" && !ev.fechaRealizacion
            ? todayISO
            : ev.fechaRealizacion || "";
        return { ...ev, estado: nuevoEstado, fechaRealizacion: nuevaFechaReal };
      });
      saveEvents(events);
      closeModal();
      renderAll();
    });

    function setTodayAsDefault() {
      const today = new Date();
      const y = today.getFullYear();
      const m = String(today.getMonth() + 1).padStart(2, "0");
      const d = String(today.getDate()).padStart(2, "0");
      const todayISO = `${y}-${m}-${d}`;
      fechaEl.value = todayISO;
      daySelectorEl.value = todayISO;
      const hh = String(today.getHours()).padStart(2, "0");
      const mm = String(today.getMinutes()).padStart(2, "0");
      horaEl.value = `${hh}:${mm}`;
    }

    (function init() {
      toggleAccordion(false); // formulario cerrado al inicio
      setTodayAsDefault();
      estadoEl.value = "pendiente";
      renderAll();
    })();
  </script>
</body>
</html>

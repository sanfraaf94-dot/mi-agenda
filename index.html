<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Agenda Semanal Elegante</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f172a;
      --bg-soft: #111827;
      --card: #020617;
      --card-soft: #020617;
      --accent: #6366f1;
      --accent-soft: rgba(99, 102, 241, 0.15);
      --border: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --danger: #f97373;
      --radius: 10px;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1f2937 0, #020617 45%);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 1200px;
      background: linear-gradient(
        135deg,
        rgba(148, 163, 184, 0.08),
        rgba(15, 23, 42, 0.98)
      );
      border-radius: 20px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      box-shadow:
        0 28px 60px rgba(15, 23, 42, 0.9),
        0 0 0 1px rgba(15, 23, 42, 0.9);
      overflow: hidden;
      backdrop-filter: blur(18px);
    }

    .app-header {
      padding: 20px 24px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.3);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: radial-gradient(circle at top left, #111827, #020617);
    }

    .app-title {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .app-title h1 {
      font-size: 1.4rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #f9fafb;
      font-weight: 600;
    }

    .app-title span {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .app-date {
      font-size: 0.9rem;
      color: var(--muted);
      text-align: right;
    }

    .app-body {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 2fr);
      gap: 1px;
      background: rgba(15, 23, 42, 0.8);
    }

    .panel {
      padding: 18px;
      background: radial-gradient(circle at top, #020617, #020617 70%);
    }

    .panel + .panel {
      border-left: 1px solid rgba(15, 23, 42, 0.9);
    }

    @media (max-width: 900px) {
      body { padding: 12px; }
      .app-body { grid-template-columns: 1fr; }
      .panel + .panel {
        border-left: none;
        border-top: 1px solid rgba(15, 23, 42, 0.9);
      }
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .section-title h2 {
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #9ca3af;
    }

    .section-title span {
      font-size: 0.75rem;
      color: var(--muted);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: radial-gradient(circle at top left, #020617, #020617 60%);
      border-radius: var(--radius);
      padding: 14px;
      border: 1px solid rgba(55, 65, 81, 0.9);
    }

    .field-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .field {
      flex: 1 1 120px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #9ca3af;
    }

    input, select, textarea {
      font: inherit;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(55, 65, 81, 0.9);
      background: rgba(15, 23, 42, 0.95);
      color: var(--text);
      outline: none;
      transition: border 0.15s, box-shadow 0.15s, background 0.15s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: rgba(129, 140, 248, 0.9);
      box-shadow: 0 0 0 1px rgba(129, 140, 248, 0.4);
      background: #020617;
    }

    textarea {
      resize: vertical;
      min-height: 60px;
    }

    .hint {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(31, 41, 55, 0.9);
      border: 1px solid rgba(55, 65, 81, 0.9);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9ca3af;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--accent);
    }

    .form-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 7px 14px;
      font: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      box-shadow: 0 8px 18px rgba(79, 70, 229, 0.8);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 25px rgba(79, 70, 229, 0.9);
    }

    .btn-secondary {
      background: rgba(31, 41, 55, 0.9);
      color: #e5e7eb;
    }

    .btn-secondary:hover {
      background: rgba(55, 65, 81, 1);
    }

    .btn-danger {
      background: rgba(248, 113, 113, 0.18);
      color: #fecaca;
      border: 1px solid rgba(248, 113, 113, 0.8);
    }

    .btn-danger:hover {
      background: rgba(248, 113, 113, 0.35);
    }

    /* Etiquetas / categorías */

    .tag-pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 0.75rem;
      border: 1px solid transparent;
      cursor: pointer;
      background: rgba(31, 41, 55, 0.9);
      color: #e5e7eb;
      gap: 5px;
      margin: 2px 4px 2px 0;
    }

    .tag-pill span.dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: currentColor;
    }

    .tag-doctores { color: #f97373; }
    .tag-facturacion { color: #38bdf8; }
    .tag-contabilidad { color: #a855f7; }
    .tag-impuestos { color: #facc15; }
    .tag-banco { color: #22c55e; }
    .tag-liquidaciones { color: #f97316; }
    .tag-personal { color: #f9a8d4; }
    .tag-seguros { color: #67e8f9; }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .date-controls {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 6px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(55, 65, 81, 0.9);
    }

    .date-controls button {
      padding: 4px 8px;
      font-size: 0.75rem;
      text-transform: none;
      letter-spacing: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--text);
    }

    .date-controls button:hover {
      background: rgba(55, 65, 81, 0.8);
    }

    .filter-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .filter-select {
      max-width: 160px;
    }

    .stats {
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 4px;
    }

    .week-grid {
      margin-top: 10px;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid rgba(31, 41, 55, 1);
      background: radial-gradient(circle at top left, #020617, #020617 60%);
      box-shadow:
        0 18px 40px rgba(15, 23, 42, 0.9),
        0 0 0 1px rgba(15, 23, 42, 0.9);
    }

    .week-header {
      display: grid;
      grid-template-columns: 60px repeat(7, minmax(0, 1fr));
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(31, 41, 55
